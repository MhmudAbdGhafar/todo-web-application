server:
  port: 8082

spring:
  application:
    name: todo-web-service
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3307/mytodo_service_dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: mysql

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  userServiceBaseUrl: http://localhost:8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html